<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Cadastro de Usuário</title>
</head>

<body>
    <div class="formulario">
        <h2>Cadastrar Usuário</h2>
        <form id="formusuario">
            <input type="text" id="nome" placeholder="Nome completo" required><br>
            <input type="email" id="email" placeholder="E-mail" required><br>
            <input type="password" id="senha" placeholder="Senha" required><br>
            <label for="datanasc" style="font-size: 12px; color: #666;">Data de Nascimento:</label><br>
            <input type="date" id="datanasc" required><br>

            <button type="submit">Cadastrar Usuário</button>
        </form>
    </div>
</body>
</html>
