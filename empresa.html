<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Cadastro de Empresa</title>
</head>

<body>
    <div class="formulario">
        <h2>Cadastrar Empresa</h2>
        <form id="formempresa">
            <input type="text" id="nome" placeholder="Nome da Empresa" required><br>
            <input type="url" id="website" placeholder="Website (https://...)" required><br>
            <input type="text" id="empresacol" placeholder="Observação / Descrição da Empresa"><br>

            <button type="submit">Cadastrar Empresa</button>
        </form>
    </div>
</body>

</html>
