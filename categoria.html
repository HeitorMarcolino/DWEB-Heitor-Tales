<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Cadastro de Categoria</title>
</head>

<body>
    <div class="formulario">
        <h2>Cadastrar Categoria</h2>
        <form id="formcategoria">
            <input type="text" id="rpg" placeholder="Descrição / Nome RPG"><br>
            <input type="text" id="acao" placeholder="Descrição / Nome Ação"><br>
            <input type="text" id="terror" placeholder="Descrição / Nome Terror"><br>

            <button type="submit">Cadastrar Categoria</button>
        </form>
    </div>
</body>

</html>
