<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="forms.css">
    <title>Cadastrar jogo</title>
</head>

<body>
    <div id="formulario">
        <form id="formjogo">
            <input type="text" id="nome" placeholder="Nome do jogo" required><br>
            <input type="url" id="imagem" placeholder="URL da imagem" required><br>
            <textarea id="sinopse" placeholder="Sinopse do jogo" required></textarea><br>
            <input type="number" id="preco" step="0.01" min="0" placeholder="Preço (R$)" required><br>
            <button type="submit">Adicionar Jogo</button>

        </form>
    </div>
    <div id="colecao"></div>
    <script src="script.js"></script>
    <script src="scriptClass.js"></script>
</body>

</html>
